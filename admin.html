<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin - SMA Negeri 3 Sarmi</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#123d6a;color:white;padding:20px}main{max-width:1100px;margin:20px auto;padding:0 15px}.card{background:white;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #0001}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#eef4ff;border-radius:12px}.stat b{display:block;font-size:28px;margin-top:8px}input,select{width:100%;padding:11px;box-sizing:border-box;margin:6px 0 12px;border:1px solid #ccd4df;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#123d6a;color:#fff;font-weight:bold;cursor:pointer;margin:3px}.secondary{background:#667085}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.status{padding:10px;background:#eef4ff;border-radius:8px;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.tablewrap{overflow:auto}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}</style></head><body><div id="login" class="card" style="max-width:400px;margin:70px auto"><h2>🔐 Login Admin</h2><p>SMA NEGERI 3 SARMI</p><input id="loginPin" type="password" placeholder="PIN Admin"><button onclick="login()" style="width:100%">MASUK</button><div id="loginMsg" class="status"></div></div><div id="app" class="hidden"><header><h1>Dashboard Admin</h1><div>Absensi Guru & Staf TU — SMA Negeri 3 Sarmi</div></header><main><div><button onclick="sec('dash')">Dashboard</button><button onclick="sec('pegawai')">Data Pegawai</button><button onclick="sec('pin')">Ubah PIN</button><button onclick="sec('waktu')">Jam Absensi</button><button class="secondary" onclick="logout()">Keluar</button></div><section id="dash"><div class="stats"><div class="stat">Total Pegawai<b id="total">0</b></div><div class="stat">Absensi Hari Ini<b id="today">-</b></div><div class="stat">Masuk<b id="masuk">-</b></div><div class="stat">Pulang<b id="pulang">-</b></div></div><div class="card"><h2>Dashboard</h2><p id="info">Memuat...</p><button onclick="refresh()">🔄 Refresh</button></div></section><section id="pegawai" class="hidden"><div class="card"><h2>Data Pegawai</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>NIP/NUPTK</th><th>Nama</th><th>Jabatan</th><th>Jenis</th><th>Wajah</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section><section id="pin" class="hidden"><div class="card"><h2>🔑 Ubah PIN Admin</h2><label>PIN Lama</label><input id="oldPin" type="password"><label>PIN Baru</label><input id="newPin" type="password"><label>Konfirmasi PIN Baru</label><input id="confirmPin" type="password"><button onclick="changePin()">SIMPAN PIN BARU</button><div id="pinMsg" class="status"></div></div></section><section id="waktu" class="hidden"><div class="card"><h2>⏰ Pengaturan Jam Absensi</h2><div class="row"><div><label>Jam Masuk</label><input id="jamMasuk" type="time"></div><div><label>Jam Pulang</label><input id="jamPulang" type="time"></div><div><label>Batas Terlambat</label><input id="batas" type="time"></div></div><button onclick="saveTime()">SIMPAN</button><div id="timeMsg" class="status"></div></div></section></main></div><script src="./config.js"></script><script>let pin='';let employees=[];async function api(action,data={}){let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});return r.json()}async function login(){let p=document.getElementById('loginPin').value;if(!p)return;try{let r=await api('adminLogin',{pin:p});if(r.ok){pin=p;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');refresh()}else document.getElementById('loginMsg').textContent=r.message}catch(e){document.getElementById('loginMsg').textContent=e.message}}function logout(){pin='';location.reload()}function sec(id){['dash','pegawai','pin','waktu'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='pegawai')render()}async function refresh(){try{let r=await api('getEmployees');if(r.ok){employees=r.employees||[];document.getElementById('total').textContent=employees.length;render()}let s=await api('settings');if(s.ok){jamMasuk.value=s.jamMasuk||'07:30';jamPulang.value=s.jamPulang||'14:00';batas.value=s.batasTerlambat||'07:31'}document.getElementById('info').textContent='Data pegawai berhasil dimuat. Data absensi tersimpan di Google Sheet.'}catch(e){document.getElementById('info').textContent=e.message}}function render(){tbody.innerHTML=employees.map(e=>`<tr><td>${esc(e.id)}</td><td>${esc(e.nip)}</td><td>${esc(e.name)}</td><td>${esc(e.position)}</td><td>${esc(e.type)}</td><td>${e.descriptor?.length?'✅ Terdaftar':'❌ Belum'}</td></tr>`).join('')}async function changePin(){let a=oldPin.value,b=newPin.value,c=confirmPin.value;if(!/^\d{6,}$/.test(b)||b!==c){pinMsg.textContent='PIN baru harus angka minimal 6 digit dan konfirmasi harus sama.';return}let r=await api('changePin',{oldPin:a,newPin:b});pinMsg.textContent=r.message;if(r.ok){pin=b;oldPin.value=newPin.value=confirmPin.value=''}}async function saveTime(){timeMsg.textContent='Pengaturan jam perlu endpoint penyimpanan pada backend.'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
